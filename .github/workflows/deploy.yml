name: CI/CD Pipeline - Smart School Mobile Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build & Validate Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Docker Image
        run: |
          docker build -t webschool-app:${{ github.sha }} .

      - name: Test Container Launch
        run: |
          docker run -d --name test-app -p 3008:3008 webschool-app:${{ github.sha }}
          sleep 3
          curl -f http://localhost:3008/ || exit 1
          docker stop test-app

  deploy:
    name: Deploy to Production (webschool.sdbo.ma)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH & Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/webschool || cd /opt/webschool || mkdir -p /var/www/webschool && cd /var/www/webschool
            git pull origin main || git pull origin master
            docker-compose down
            docker-compose up -d --build
            docker system prune -f
